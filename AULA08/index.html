<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula08</title>
</head>
<body>
    <!-- 
    <Form> = Define um formulário
    <Input> = Define um campo de entrada(text, email, password, etc.)
    <Label> = Define um rótulo para um campo de entrada
    <textarea> = Define uma área de texto maior
    <select> e <option> = Define um menu suspenso
    <Button> = Define um botão
    <fieldset> e <legend> = Define um grupo de elementos e um título para o grupo
    <datalist> = Define uma lista de opções para um campo de entrada
    -->

    <h1>Formulário Completo</h1>

    <form action="/enviar-dados" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>
           
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
            <br>
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
            <br>
            <label for="password">Senha:</label>
            <input type="password" name="password" id="password" placeholder="Digite sua senha">
            <br>
            <label for="idade">Idade:</label>
            <input type="number" name="idade" id="idade" placeholder="Digite sua idade">
            <br>
            <label for="data-nascimento">Data de Nascimento:</label>
            <input type="date" name="data-nascimento" id="data-nascimento">
            <br>
            <label for="genero">Gênero:</label>
            <select name="genero" id="genero">
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                <option value="prefiro_nao_dizer">Prefiro Não Dizer</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Detalhes Adicionais</legend>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone">
            <br>
            <label for="endereco">Endereço:</label>
            <textarea name="endereco" id="endereco" placeholder="Digite seu endereço"></textarea>
        </fieldset>
    </form>
</body>
</html>
