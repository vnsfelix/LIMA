<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Links em HTML</title>
</head>
<body font-family="Arial, Helvetica sans-serif">

    <h1>Exemplos de Links em HTML</h1>

    <h2>1. Link para outra página do site</h2>
    <p>
        <a href="sobre.html">Ir para a página Sobre</a>
    </p>

    <h2>2. Link para um site externo</h2>
    <p>
        <a href="https://www.google.com" target="_blank">
            Acessar o Google
        </a>
    </p>

    <h2>3. Link para contato</h2>
    <p>
        <a href="contato.html">Entrar em contato</a>
    </p>

    <h2>4. Link para download de um arquivo</h2>
    <p>
        <a href="10 - Ligações em toda parte.pdf" download>
            Baixar Documento PDF
        </a>
    </p>
</body>
</html>
