<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07</title>
</head>
<body>
    <!-- TABELAS -->
    <!-- 
    <table> = Define uma tabela
    <thead> = Define uma regiao do cabeçalho
    <tr> = Define uma linha da tabela
    <tbody> = Define a regiao do corpo
    <td> = Define uma celula (Dados da tabela)
    border="1" = Adiciona bordas na tabela
    -->

    <table border="1">
        <thead>
            <tr>
                <th>nome</th>
                <th>idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Felix</td>
                <td>16</td>
                <td>Jd Pres Dutra</td>
            </tr>
            <tr>
                <td>Joao</td>
                <td>18</td>
                <td>Jd Pres Dutra</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
