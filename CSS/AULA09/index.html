<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA09</title>

    <!-- CSS Interno -->
    <!-- Ele fica dentro da tag <style> no <head> do HTML -->
    <style>
        body {
            background-color: #404040;
        }
        h1 {
            color:red;
        }

        h2 {
            color:blue;
        }
    </style>

    <!-- =============================================================================== -->
    <!-- CSS Externo - O MELHOR DE TODOS -->
    <!-- Ele fica em um arquivo separado com extensão .css e é linkado no <head> do HTML -->
    <link rel="stylesheet" href="style.css">
    <!-- =============================================================================== -->
</head>
<body>
    <!-- CSS (Cascading Style Sheets) é o que dá forma, cores e layout às páginas web -->
    <!-- CSS Inline -->
    <!-- Definido diretamente na tag html, dentro do atributo style="" -->
    <!-- Quando usado, o CSS Inline tem prioridade sobre o CSS Externo e Interno -->
    <!-- Quando usar? -->
    <!-- Quando voce precisa estilizar um elemento específico e não quer criar uma regra separada -->

    <h1>AULA09 - CSS</h1>
    <h2>DSI1 SESI - OS MAIS ZIKAS</h2>
</body>
</html>
