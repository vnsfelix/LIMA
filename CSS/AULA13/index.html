<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA13</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Entendendo o display</h1>

    <p>
        O <strong>display</strong> define como o elemento se comporta na pagina
    </p>

    <!-- Block -->
    <h2>1. Block</h2>
    <div class="block"> CAIXA 1</div>
    <div class="block"> CAIXA 2</div>
    <div class="block"> CAIXA 3</div>

    <!-- Inline -->
     <h2>2. Inline</h2>
     <div class="inline"> CAIXA 1</div>
     <div class="inline"> CAIXA 2</div>
     <div class="inline"> CAIXA 3</div>
     
     <!-- Inline Block -->
      <h2>3. Inline Block</h2>
      <div class="inline-block"> CAIXA 1</div>
      <div class="inline-block"> CAIXA 2</div>
      <div class="inline-block"> CAIXA 3</div>
</body>
</html>
