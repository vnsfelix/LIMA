<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 06</title>
</head>
<body>
    <!-- Semantica no HTML, significa usar as tags certas para cada tipo de conteúdo, ajudando navegadores, mecanismos e busca e leitores de tela a entenderem melhor a estrutura da página -->

    <!-- Beneficios do HTML Semantico -->
    <!-- Melhora a acessibilidade (leitores de tela conseguem interpreyar melhor) 
    Melhora o SEO (O Google entende melhor a estrutura do site)
    Facilita a manutenção do código (código mais legível e organizado)
    Ajuda na responsividade (tags semanticas trabalham melhor como css e js)
    -->

    <!---------------------------------------->
    <!-- SEM SEMANTICA -->
    <!-- <a href="...">Link</a> -->
    <!--  -->

    <!-- COM SEMANTICA -->
    <header>
        <!-- O topo do site ou de uma seção (Logo, Titulo e menu de navegação) -->
        <nav>
            <!-- Contem links de navegação para outras páginas do site -->
            <a href="index.html">Inicio</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <!-- O conteúdo principal do site -->
        <p>Noticias AO VIVO do SESI</p>

        <section>
            <!-- Usada para agrupar conteudos relacionados dentro de uma pagina, geralmente com um titulo, indicando que fazem parte de um tema especifico -->
            <h2>Noticias</h2>
            <p>Conteúdo das noticias...</p>

            <article>
                <!-- Representa um conteudo independente ou autocontido, que pode ser distribuido ou reutilizado separadamente sem perder o sentido. Ex: Postagens Blog, Noticias, Comentarios de usuarios, Cards de Produtos, ou artigos de revista, ... -->
                <h3>Os alunos amam ir ao SENAI</h3>
                <P>Descrição...</P>
            </article>
        </section>

        <aside>
            <!-- Usada para agrupar conteudos que não são principais, como anuncios, links relacionados, ou informacoes complementares, ela aparece como:
            -Barras laterais
            -Informacoes complementares
            -Anuncios
            -->
            <h3>Videos Recomendados</h3>
            <ul>
                <li>como programar em HTML</li>
            </ul>

        </aside>
        
        <footer>
            <!-- Representa o rodapé do site ou de uma seção, contendo informações como direitos autorais, links para páginas importantes, ou informações de contato
             -->
        </footer>
    </main>
    <footer>
        <p>&copy;Todos os direitos reservados.</p>
    </footer>
    
</body>
</html>
